<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>剩余电量监控 · 大厅</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 24px; color: #2c3e50;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .header {
    background: rgba(255,255,255,0.95); border-radius: 16px; padding: 24px 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15); margin-bottom: 20px;
  }
  .header h1 { font-size: 20px; color: #444; margin-bottom: 4px; }
  .header .sub { color: #888; font-size: 13px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; }
  .card {
    background: rgba(255,255,255,0.95); border-radius: 16px; padding: 22px 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15); margin-bottom: 20px;
  }
  .stat { flex: 1; min-width: 220px; text-align: center; }
  .stat .label { color: #888; font-size: 13px; margin-bottom: 8px; }
  .stat .value { font-size: 42px; font-weight: 700; color: #667eea; line-height: 1.1; }
  .stat .unit { font-size: 16px; color: #aaa; margin-left: 4px; font-weight: 400; }
  .stat .updated { color: #999; font-size: 12px; margin-top: 8px; }
  .controls { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 14px; justify-content: center; align-items: center; }
  .controls label { font-size: 14px; color: #555; margin-right: 6px; }
  .controls select {
    padding: 8px 14px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; background: #fff; cursor: pointer; outline: none;
  }
  #chart { width: 100%; height: 380px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #f0f0f0; }
  th { background: #f8f9fc; color: #667eea; font-weight: 600; }
  tr:hover td { background: #fafbff; }
  .table-wrap { max-height: 380px; overflow-y: auto; }
  .empty { text-align: center; color: #aaa; padding: 40px; }
  .badge { display:inline-block; background:#eef2ff; color:#667eea; padding:2px 10px; border-radius:10px; font-size:12px; margin-left:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>⚡ 剩余电量监控 <span class="badge">GitHub Actions 云端采集</span></h1>
    <div class="sub">表名称：大厅 &nbsp;|&nbsp; 表号：18501681136 &nbsp;|&nbsp; 采集频率：每 30 分钟（整点 / 半点，北京时间）</div>
  </div>

  <div class="row">
    <div class="card stat">
      <div class="label">当前剩余电量</div>
      <div><span class="value" id="curVal">--</span><span class="unit">kWh</span></div>
      <div class="updated" id="curTime">加载中...</div>
    </div>
    <div class="card controls">
      <div>
        <label>选择日期：</label>
        <select id="dateSel"></select>
      </div>
      <div style="font-size:12px;color:#999;">
        数据由 GitHub Actions 每 30 分钟自动抓取并提交回本仓库
      </div>
    </div>
  </div>

  <div class="card">
    <div style="font-size:15px;color:#444;margin-bottom:12px;font-weight:600;">📈 当日电量曲线</div>
    <div id="chart"></div>
  </div>

  <div class="card">
    <div style="font-size:15px;color:#444;margin-bottom:12px;font-weight:600;">📋 当日采集记录</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>采集时间</th><th>剩余电量 (kWh)</th><th>较上次变化</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyTip" style="display:none;">当日暂无数据</div>
    </div>
  </div>
</div>

<script>
const chart = echarts.init(document.getElementById('chart'));
let ALL = [];

function fmtDelta(d) {
  if (d === null || d === undefined) return '-';
  if (d > 0) return '+' + d.toFixed(2);
  if (d < 0) return d.toFixed(2);
  return '0.00';
}

function groupByDate(rows) {
  const map = {};
  rows.forEach(r => {
    const d = r.ts.substring(0, 10);
    (map[d] = map[d] || []).push(r);
  });
  return map;
}

async function loadAll() {
  try {
    const r = await fetch('data.json?t=' + Date.now());
    ALL = await r.json();
  } catch (e) {
    ALL = [];
  }
  render();
}

function render() {
  const latest = ALL[ALL.length - 1];
  if (latest) {
    document.getElementById('curVal').textContent = Number(latest.battery).toFixed(2);
    document.getElementById('curTime').textContent = '更新于 ' + latest.ts;
  } else {
    document.getElementById('curTime').textContent = '暂无数据（等待首次采集）';
  }

  const map = groupByDate(ALL);
  const dates = Object.keys(map).sort().reverse();
  const sel = document.getElementById('dateSel');
  const prev = sel.value;
  sel.innerHTML = '';
  dates.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d + '（' + map[d].length + '条）';
    sel.appendChild(opt);
  });
  if (dates.length === 0) {
    sel.innerHTML = '<option>（暂无数据）</option>';
    chart.clear();
    document.getElementById('tbody').innerHTML = '';
    document.getElementById('emptyTip').style.display = 'block';
    return;
  }
  if (prev && dates.includes(prev)) sel.value = prev;
  renderDay(map[sel.value]);
}

function renderDay(data) {
  const times = data.map(r => r.ts.substring(11, 16));
  const vals = data.map(r => r.battery);
  chart.setOption({
    tooltip: { trigger: 'axis', valueFormatter: v => v + ' kWh' },
    grid: { left: 50, right: 30, top: 30, bottom: 40 },
    xAxis: { type: 'category', data: times, boundaryGap: false, axisLine: { lineStyle: { color: '#ccc' } } },
    yAxis: { type: 'value', name: 'kWh', scale: true, splitLine: { lineStyle: { color: '#f0f0f0' } } },
    series: [{
      name: '剩余电量', type: 'line', smooth: true, data: vals,
      symbol: 'circle', symbolSize: 7,
      lineStyle: { width: 3, color: '#667eea' },
      itemStyle: { color: '#667eea' },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0,0,0,1,[
          {offset:0, color:'rgba(102,126,234,0.45)'},
          {offset:1, color:'rgba(102,126,234,0.02)'}
        ])
      }
    }]
  }, true);

  const tb = document.getElementById('tbody');
  tb.innerHTML = '';
  document.getElementById('emptyTip').style.display = data.length ? 'none' : 'block';
  let prev = null;
  data.forEach((r, i) => {
    const delta = prev === null ? null : r.battery - prev;
    prev = r.battery;
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + (i+1) + '</td><td>' + r.ts + '</td>' +
                   '<td>' + Number(r.battery).toFixed(2) + '</td>' +
                   '<td>' + fmtDelta(delta) + '</td>';
    tb.appendChild(tr);
  });
}

document.getElementById('dateSel').addEventListener('change', () => {
  const map = groupByDate(ALL);
  renderDay(map[document.getElementById('dateSel').value] || []);
});
window.addEventListener('resize', () => chart.resize());

loadAll();
// 每 60 秒重新拉一次 data.json，看板自动更新
setInterval(loadAll, 60000);
</script>
</body>
</html>
